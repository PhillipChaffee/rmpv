# Differential check of Mpv/Common/Playlist.lean against mpv's common/playlist.c.

oracle = "playlist-oracle"
# The file the harness includes and the mutations edit.
file = "common/playlist.c"
# The harness supplies the random numbers playlist_shuffle draws and the
# demuxer playlist_parse_file opens.
link_args = [
  "-Wl,--wrap=mp_rand_in_range32",
  "-Wl,--wrap=demux_open_url",
  "-Wl,--wrap=demux_free",
]

# Each mutation plants one bug in a copy of the file. The check must notice
# every one. A function counts as checked only if it has a mutation here.

[[mutation]]
function = "playlist_update_indexes"
find = "start = MPMAX(start, 0);"
replace = "start = MPMAX(start, 1);"

[[mutation]]
function = "playlist_update_indexes"
find = "pl->entries[n]->pl_index = n;"
replace = "pl->entries[n]->pl_index = n + 1;"

[[mutation]]
function = "playlist_insert_at"
find = "add->id = ++pl->id_alloc;"
replace = "add->id = pl->id_alloc++;"

[[mutation]]
function = "playlist_insert_at"
find = "playlist_update_indexes(pl, index, pl->num_entries);"
replace = "playlist_update_indexes(pl, index, index + 1);"

[[mutation]]
function = "playlist_remove"
find = "pl->current = playlist_entry_get_rel(entry, 1);"
replace = "pl->current = playlist_entry_get_rel(entry, -1);"

[[mutation]]
function = "playlist_remove"
find = "pl->current_was_replaced = true;"
replace = "pl->current_was_replaced = false;"

[[mutation]]
function = "playlist_remove"
find = "playlist_update_indexes(pl, entry->pl_index, -1);"
replace = "playlist_update_indexes(pl, entry->pl_index + 1, -1);"

[[mutation]]
function = "playlist_get_next"
find = "pl->playlist_completed && direction < 0"
replace = "pl->playlist_completed && direction > 0"

[[mutation]]
function = "playlist_get_next"
find = "return pl->current_was_replaced ? pl->current :"
replace = "return !pl->current_was_replaced ? pl->current :"

[[mutation]]
function = "playlist_entry_get_rel"
find = "e->pl_index + direction"
replace = "e->pl_index - direction"

[[mutation]]
function = "playlist_entry_from_index"
find = "return index >= 0 && index"
replace = "return index > 0 && index"

[[mutation]]
function = "playlist_entry_to_index"
find = "if (!e || e->pl != pl)"
replace = "if (!e)"

[[mutation]]
function = "playlist_get_first"
find = "return pl->num_entries ? pl->entries[0] : NULL;"
replace = "return pl->num_entries ? pl->entries[pl->num_entries - 1] : NULL;"

[[mutation]]
function = "playlist_get_last"
find = "? pl->entries[pl->num_entries - 1] : NULL;"
replace = "? pl->entries[0] : NULL;"

[[mutation]]
function = "playlist_entry_count"
find = "return pl->num_entries;"
replace = "return pl->num_entries + 1;"

[[mutation]]
function = "playlist_entry_new"
find = "local_filename ? local_filename : filename"
replace = "filename"

[[mutation]]
function = "playlist_entry_new"
find = "e->stream_flags = STREAM_ORIGIN_DIRECT;"
replace = "e->stream_flags = STREAM_ORIGIN_FS;"

[[mutation]]
function = "playlist_entry_new"
find = "e->original_index = -1;"
replace = "e->original_index = 0;"

[[mutation]]
function = "playlist_entry_add_param"
find = "{bstrdup(e, name), bstrdup(e, value)}"
replace = "{bstrdup(e, value), bstrdup(e, name)}"

[[mutation]]
function = "playlist_entry_add_params"
find = "for (int n = 0; n < num_params; n++)"
replace = "for (int n = 1; n < num_params; n++)"

[[mutation]]
function = "playlist_entry_add_params"
find = "playlist_entry_add_param(e, params[n].name, params[n].value);"
replace = "playlist_entry_add_param(e, params[0].name, params[0].value);"

[[mutation]]
function = "playlist_set_params"
find = "pl->entries[n]->num_params = 0;"
replace = ";"

[[mutation]]
function = "playlist_set_params"
find = "playlist_entry_add_params(pl->entries[n], params, num_params);"
replace = "playlist_entry_add_params(pl->entries[0], params, num_params);"

[[mutation]]
function = "playlist_entry_unref"
find = "e->reserved--;"
replace = "e->reserved -= 2;"

[[mutation]]
function = "playlist_entry_unref"
find = "if (e->reserved < 0) {"
replace = "if (e->reserved <= 0) {"

[[mutation]]
function = "playlist_clear"
find = "for (int n = pl->num_entries - 1; n >= 0; n--)\n        playlist_remove(pl, pl->entries[n]);"
replace = "for (int n = pl->num_entries - 1; n > 0; n--)\n        playlist_remove(pl, pl->entries[n]);"

[[mutation]]
function = "playlist_clear"
find = "pl->current_was_replaced = false;"
replace = "pl->current_was_replaced = true;"

[[mutation]]
function = "playlist_clear"
find = "pl->playlist_completed = false;\n    pl->playlist_started = false;\n    TA_FREEP"
replace = "pl->playlist_completed = true;\n    pl->playlist_started = false;\n    TA_FREEP"

[[mutation]]
function = "playlist_clear"
find = "pl->playlist_started = false;\n    TA_FREEP"
replace = "pl->playlist_started = true;\n    TA_FREEP"

[[mutation]]
function = "playlist_clear"
find = "TA_FREEP(&pl->playlist_dir);"
replace = ";"

[[mutation]]
function = "playlist_clear_except_current"
find = "if (pl->entries[n] != pl->current)"
replace = "if (pl->entries[n] == pl->current)"

[[mutation]]
function = "playlist_clear_except_current"
find = "for (int n = pl->num_entries - 1; n >= 0; n--) {"
replace = "for (int n = pl->num_entries - 1; n > 0; n--) {"

[[mutation]]
function = "playlist_clear_except_current"
find = "pl->playlist_completed = false;\n    pl->playlist_started = false;\n}"
replace = "pl->playlist_completed = true;\n    pl->playlist_started = false;\n}"

[[mutation]]
function = "playlist_clear_except_current"
find = "pl->playlist_started = false;\n}"
replace = "pl->playlist_started = true;\n}"

[[mutation]]
function = "playlist_move"
find = "if (old_index >= index)"
replace = "if (old_index <= index)"

[[mutation]]
function = "playlist_move"
find = "MPMIN(index - 1, old_index - 1)"
replace = "MPMAX(index - 1, old_index - 1)"

[[mutation]]
function = "playlist_move"
find = "MPMAX(index + 1, old_index + 1)"
replace = "MPMIN(index + 1, old_index + 1)"

[[mutation]]
function = "playlist_move"
find = "MP_TARRAY_REMOVE_AT(pl->entries, pl->num_entries, old_index);"
replace = "MP_TARRAY_REMOVE_AT(pl->entries, pl->num_entries, entry->pl_index);"

[[mutation]]
function = "playlist_append_file"
find = "playlist_insert_at(pl, playlist_entry_new(filename), NULL);"
replace = "playlist_insert_at(pl, playlist_entry_new(filename), playlist_get_first(pl));"

[[mutation]]
function = "playlist_populate_playlist_path"
find = "for (int n = 0; n < pl->num_entries; n++) {\n        struct playlist_entry *e = pl->entries[n];"
replace = "for (int n = 1; n < pl->num_entries; n++) {\n        struct playlist_entry *e = pl->entries[n];"

[[mutation]]
function = "playlist_populate_playlist_path"
find = "e->playlist_path = playlist_path;"
replace = "e->playlist_path = e->playlist_path ? e->playlist_path : playlist_path;"

[[mutation]]
function = "playlist_set_stream_flags"
find = "pl->entries[n]->stream_flags = flags;"
replace = "pl->entries[n]->stream_flags |= flags;"

[[mutation]]
function = "playlist_set_stream_flags"
find = "for (int n = 0; n < pl->num_entries; n++)\n        pl->entries[n]->stream_flags"
replace = "for (int n = 1; n < pl->num_entries; n++)\n        pl->entries[n]->stream_flags"

[[mutation]]
function = "playlist_set_current"
find = "if (!pl->playlist_dir)"
replace = "if (pl->playlist_dir)"

[[mutation]]
function = "playlist_set_current"
find = "if (pl->entries[i]->playlist_path &&"
replace = "if (!pl->entries[i]->playlist_path ||"

[[mutation]]
function = "playlist_set_current"
find = "!strcmp(pl->entries[i]->filename, pl->entries[i]->playlist_path)) {"
replace = "strcmp(pl->entries[i]->filename, pl->entries[i]->playlist_path)) {"

[[mutation]]
function = "playlist_set_current"
find = "break;"
replace = "continue;"

[[mutation]]
function = "playlist_shuffle"
find = "pl->entries[n]->original_index = n;"
replace = "pl->entries[n]->original_index = n + 1;"

[[mutation]]
function = "playlist_shuffle"
find = "mp_rand_in_range32(&s, n, pl->num_entries);"
replace = "mp_rand_in_range32(&s, 0, pl->num_entries);"

[[mutation]]
function = "playlist_shuffle"
find = "MPSWAP(struct playlist_entry *, pl->entries[n], pl->entries[j]);"
replace = "MPSWAP(struct playlist_entry *, pl->entries[0], pl->entries[j]);"

[[mutation]]
function = "playlist_shuffle"
find = "for (int n = 0; n < pl->num_entries - 1; n++) {"
replace = "for (int n = 1; n < pl->num_entries - 1; n++) {"

[[mutation]]
function = "playlist_shuffle"
find = "    }\n    playlist_update_indexes(pl, 0, -1);"
replace = "    }\n    playlist_update_indexes(pl, 1, -1);"

[[mutation]]
function = "cmp_unshuffle"
find = "if (ea->original_index >= 0 &&"
replace = "if (ea->original_index > 0 &&"

[[mutation]]
function = "cmp_unshuffle"
find = "ea->original_index != eb->original_index)"
replace = "ea->original_index > eb->original_index)"

[[mutation]]
function = "cmp_unshuffle"
find = "return CMP_INT(ea->original_index, eb->original_index);"
replace = "return CMP_INT(eb->original_index, ea->original_index);"

[[mutation]]
function = "cmp_unshuffle"
find = "return CMP_INT(ea->pl_index, eb->pl_index);"
replace = "return CMP_INT(eb->pl_index, ea->pl_index);"

[[mutation]]
function = "playlist_unshuffle"
find = "if (pl->num_entries)\n        qsort"
replace = "if (pl->num_entries > 2)\n        qsort"

[[mutation]]
function = "playlist_unshuffle"
find = "cmp_unshuffle);\n    playlist_update_indexes(pl, 0, -1);"
replace = "cmp_unshuffle);\n    playlist_update_indexes(pl, 1, -1);"

[[mutation]]
function = "playlist_get_first_in_next_playlist"
find = "strcmp(entry->playlist_path, pl->current->playlist_path) == 0)"
replace = "strcmp(entry->playlist_path, pl->current->playlist_path) != 0)"

[[mutation]]
function = "playlist_get_first_in_next_playlist"
find = "entry = playlist_entry_get_rel(entry, direction);"
replace = "entry = playlist_entry_get_rel(entry, -direction);"

[[mutation]]
function = "playlist_get_first_in_next_playlist"
find = "if (direction < 0)\n        entry = playlist_get_first_in_same_playlist"
replace = "if (direction > 0)\n        entry = playlist_get_first_in_same_playlist"

[[mutation]]
function = "playlist_get_first_in_same_playlist"
find = "mp_path_strip_trailing_separator(playlist_path);"
replace = ";"

[[mutation]]
function = "playlist_get_first_in_same_playlist"
find = "bstr0(talloc_strdup_append(playlist_path, \"/\")))\n#if"
replace = "bstr0(talloc_strdup_append(playlist_path, \"\")))\n#if"

[[mutation]]
function = "playlist_get_first_in_same_playlist"
find = "struct playlist_entry *prev = playlist_entry_get_rel(entry, -1);"
replace = "struct playlist_entry *prev = playlist_entry_get_rel(entry, 1);"

[[mutation]]
function = "playlist_get_first_in_same_playlist"
find = "strcmp(prev->playlist_path, entry->playlist_path) == 0) {"
replace = "strcmp(prev->playlist_path, entry->playlist_path) != 0) {"

[[mutation]]
function = "playlist_get_first_in_same_playlist"
find = "while (prev && prev->playlist_path &&"
replace = "if (prev && prev->playlist_path &&"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "e->pl = pl;"
replace = ";"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "e->id = ++pl->id_alloc;"
replace = "e->id = pl->id_alloc++;"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "playlist_update_indexes(pl, dst_index + count, -1);"
replace = "playlist_update_indexes(pl, dst_index + count + 1, -1);"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "source_pl->num_entries = 0;"
replace = ";"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "pl->playlist_completed = source_pl->playlist_completed;"
replace = "pl->playlist_completed = source_pl->playlist_started;"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "pl->playlist_started = source_pl->playlist_started;"
replace = ";"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "return first ? first->id : 0;"
replace = "return first ? first->id : 1;"

[[mutation]]
function = "playlist_transfer_entries_to"
find = "return first ? first->id : 0;"
replace = "return first ? first->id + 1 : 0;"

[[mutation]]
function = "playlist_transfer_entries"
find = "int add_at = pl->num_entries;"
replace = "int add_at = 0;"

[[mutation]]
function = "playlist_transfer_entries"
find = "add_at = pl->current->pl_index + 1;"
replace = "add_at = pl->current->pl_index;"

[[mutation]]
function = "playlist_transfer_entries"
find = "add_at += 1;"
replace = "add_at -= 1;"

[[mutation]]
function = "playlist_append_entries"
find = "return playlist_transfer_entries_to(pl, pl->num_entries, source_pl);"
replace = "return playlist_transfer_entries_to(pl, 0, source_pl);"

[[mutation]]
function = "playlist_parse_file"
find = ".force_format = \"playlist\","
replace = ".force_format = \"m3u\","

[[mutation]]
function = "playlist_parse_file"
find = ".stream_flags = STREAM_ORIGIN_DIRECT,"
replace = ".stream_flags = STREAM_ORIGIN_FS,"

[[mutation]]
function = "playlist_parse_file"
find = "demux_open_url(path, &p, cancel, global);"
replace = "demux_open_url(file, &p, cancel, global);"

[[mutation]]
function = "playlist_parse_file"
find = "if (!d)\n        goto done;"
replace = "if (d)\n        goto done;"

[[mutation]]
function = "playlist_parse_file"
find = "playlist_populate_playlist_path(d->playlist, file);"
replace = ";"

[[mutation]]
function = "playlist_parse_file"
find = "playlist_transfer_entries(ret, d->playlist);"
replace = ";"
