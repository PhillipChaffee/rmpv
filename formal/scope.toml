# Files the model deliberately does not cover. Everything else in mpv's own
# repository counts against coverage, on every platform. Code from other
# projects (FFmpeg, libplacebo, libass) is never counted: only mpv's source is
# parsed. Each entry needs a reason a reviewer can disagree with.

[[exclude]]
glob = "test/**"
reason = "mpv's own unit tests, not player behaviour"

[[exclude]]
glob = "fuzzers/**"
reason = "fuzzing harnesses, not player behaviour"
