name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # formal/build-mpv.sh and formal/README.md name Ubuntu 24.04 packages.
    runs-on: ubuntu-24.04
    # Nothing is cached but Rust: every run builds libplacebo and mpv from
    # source, then compiles and runs one harness per planted bug.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,typos-cli,taplo-cli
      - name: Install mpv build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config gcc g++ git python3 \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: make ci
