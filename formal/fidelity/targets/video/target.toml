# Differential check of Mpv/Player/Video.lean against mpv's player/video.c.

oracle = "video-oracle"
# The file the harness includes and the mutations edit.
file = "player/video.c"
# The harness supplies what the audio output reports: its delay, its format,
# and whether audio/format.c calls that format PCM.
link_args = [
  "-Wl,--wrap=ao_get_delay",
  "-Wl,--wrap=ao_get_format",
  "-Wl,--wrap=af_fmt_is_pcm",
]

# Each mutation plants one bug in a copy of the file. The check must notice
# every one. A function counts as checked only if it has a mutation here.

