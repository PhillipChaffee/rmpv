[package]
name = "mpv-cover"
description = "Reports which mpv code paths the formal model in formal/ accounts for"
keywords = ["mpv", "formal", "coverage"]
categories = ["development-tools"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
walkdir = "2"

[lints]
workspace = true
